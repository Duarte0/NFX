name: nfx-inov

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nfx_inov}
      POSTGRES_USER: ${POSTGRES_USER:-nfx_inov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - nfx_network

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9010}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9011}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - nfx_network

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-nfx-documentos}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/"$${MINIO_BUCKET}"
        mc anonymous set none local/"$${MINIO_BUCKET}"
    restart: "no"
    networks:
      - nfx_network

  dev-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
        NODE_MAJOR: ${NODE_MAJOR:-22}
        GRAPHIFYY_VERSION: ${GRAPHIFYY_VERSION:-0.9.32}
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    volumes:
      - .:/workspace
      - codex_auth:/root/.codex
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nfx_inov}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nfx_inov}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-nfx-documentos}
      TZ: ${TZ:-America/Sao_Paulo}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - nfx_network

networks:
  nfx_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  codex_auth:
