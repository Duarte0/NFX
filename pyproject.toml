[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "nfx.settings"
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "backend"
plugins = ["mypy_django_plugin.main"]
strict = true
exclude = ["graphify-out"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "nfx.settings"
