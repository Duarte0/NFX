name: ${COMPOSE_PROJECT_NAME:-nfx-p0-test}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nfx_test
      POSTGRES_USER: nfx_test
      POSTGRES_PASSWORD: nfx_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfx_test -d nfx_test"]
      interval: 2s
      timeout: 2s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data
    environment:
      MINIO_ROOT_USER: nfx_test
      MINIO_ROOT_PASSWORD: nfx-test-only-password
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 20
  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: nfx_test
      MINIO_ROOT_PASSWORD: nfx-test-only-password
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
    entrypoint: ["/bin/sh", "-ec", "mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; mc mb local/\"$${MINIO_BUCKET}\"; mc anonymous set none local/\"$${MINIO_BUCKET}\""]
  test-runner:
    build:
      context: .
      target: test
    environment: &test_environment
      NFX_PROFILE: test
      NFX_SECRET_KEY: synthetic-test-django-secret
      NFX_CERTIFICATE_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DATABASE_URL: postgresql://nfx_test:nfx_test_only@postgres:5432/nfx_test
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: nfx_test
      MINIO_ROOT_PASSWORD: nfx-test-only-password
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
      TEST_RUN_ID: ${TEST_RUN_ID:-}
    depends_on: &test_dependencies
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
  web:
    build:
      context: .
      target: app
    command: python backend/manage.py runserver 0.0.0.0:8000 --noreload
    environment:
      <<: *test_environment
      NFX_PROCESS: web
    depends_on: *test_dependencies
  worker:
    build:
      context: .
      target: app
    command: python backend/manage.py worker
    environment:
      <<: *test_environment
      NFX_PROCESS: worker
    depends_on: *test_dependencies
  scheduler:
    build:
      context: .
      target: app
    command: python backend/manage.py scheduler
    environment:
      <<: *test_environment
      NFX_PROCESS: scheduler
    depends_on: *test_dependencies
